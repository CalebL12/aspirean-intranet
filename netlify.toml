# Aspirean Intranet — static site plus one function. No build step.

[build]
  publish = "."
  functions = "netlify/functions"
  # Explicit so the @netlify/blobs dependency is guaranteed to be installed
  # before the functions are bundled, rather than relying on detection.
  command = "npm install --no-audit --no-fund"

# The intranet reads submissions back through this.
[[redirects]]
  from = "/api/responses"
  to = "/.netlify/functions/responses"
  status = 200

# The form records itself here the moment it is sent.
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/mf-submit"
  status = 200

# Keep the whole site out of search indexes and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Logos and covers change rarely and always under the same names, so a day
# of cache is safe and saves a burst of image requests on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cycle records should not be cached stale.
[[headers]]
  for = "/records/*"
  [headers.values]
    Cache-Control = "no-cache"
